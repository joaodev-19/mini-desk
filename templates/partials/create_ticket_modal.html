<div 
    class="modal fade"
    tabindex="-1" 
    id="new-ticket-modal" 
    aria-labelledby="initTicketLabel" 
    aria-hidden="true" 
    data-bs-theme="dark"
    >
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h3 class="modal-title fs-5" id="initTicketLabel">Iniciar Chamado</h3>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>

            <div class="modal-body">
                <form id="new-ticket-form">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-6 mb-3">
                            <label for="title-input" class="form-label">Título</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="title-input" 
                                name="title"
                                aria-label="Ticket Title"
                                >
                        </div>

                        <div class="col-6 mb-3">
                            <label for="module-select" class="form-label">Módulo</label>
                            <select name="module" id="module-select" class="form-select">
                                <option value="" selected>...</option>
                                <option value="clients">Clientes</option>
                                <option value="processes">Processos</option>
                                <option value="calendar">Agenda</option>
                                <option value="documents">Documentos</option>
                                <option value="users">Usuários</option>
                                <option value="others">Outros</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 mb-3">
                            <label for="description-textarea" class="form-label">Descrição</label>
                            <textarea 
                                name="description" 
                                id="description-textarea" 
                                class="form-control"
                                cols="12"
                                rows="6">     
                            </textarea>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12 mb-3">
                            <div class="card border-dashed border-2 text-center p-5 bg-dark" id="dropZone" style="border-style: dashed !important;">
                                <div class="card-body">
                                    <i class="bi bi-upload fs-1"></i>
                                    <h5 class="card-title fw-bold">Arraste ou solte seus arquivos</h5>
                                    <p class="text-muted small">ou clique aqui para pesquisar em seu computador</p>
                                    
                                    <label class="primary-button compact-button mt-2">
                                    Selecionar arquivos
                                    <input type="file" name="file" id="fileInput" class="d-none">
                                    </label>
                                <div id="fileName" class="mt-3 fw-semibold text-success small"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="secondary-button" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="primary-button">Salvar Chamado</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
